site_name: PgQueryNarrative
site_description: PostgreSQL query investigation, plan findings, proposed rewrites, measured compare, result verification and evidence-backed reports.

# The canonical address of the published documentation, used for canonical tags
# and sitemap.xml. Deployed by .github/workflows/docs.yml on every push to main
# that touches docs/ or mkdocs.yml.
site_url: https://pgquery-narrative.github.io/pgquerynarrative/

# repo_url / repo_name are top-level MkDocs settings; the theme reads them to
# render the repository link in the header. They were previously under `extra`,
# where MkDocs ignores them, so the link never appeared.
repo_url: https://github.com/pgquery-narrative/pgquerynarrative
repo_name: pgquery-narrative/pgquerynarrative
edit_uri: edit/main/docs/

# docs/README.md is a pointer for people browsing the repo on GitHub, and the
# Dockerfile/requirements.txt build the docs image. None of them belong in the
# built site. The leading slash anchors each pattern to the docs root.
exclude_docs: |
  /README.md
  /Dockerfile
  /requirements.txt

# Broken links and anchors are errors, not notes. Without this they are logged
# at INFO and --strict lets them through, which is how a docs gate ends up
# passing over links that 404.
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # Pages set explicit heading ids ("## LLM {#llm}") so cross-page anchors stay
  # stable when a heading is reworded. Without attr_list those braces render as
  # literal text in the heading and the id is never created.
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # Pages moved when the docs were reorganised by audience (Learn → Investigate →
  # Integrate → Secure → Operate → Reference → Develop). Every old URL keeps
  # working so links in issues, PRs and search engines do not rot.
  - redirects:
      redirect_maps:
        configuration.md: reference/configuration.md
        ui-overview.md: workbench/ui-overview.md
        DATASET.md: examples/dataset.md
        api/README.md: reference/api.md
        api/examples.md: integrations/rest-api.md
        usage/cli-usage.md: reference/cli.md
        getting-started/llm-setup.md: integrations/llm.md
        getting-started/embedded.md: integrations/embedded-go.md
        reference/deployment.md: operate/deployment.md
        reference/operations.md: operate/monitoring.md
        reference/troubleshooting.md: operate/troubleshooting.md
        reference/postgres-extension.md: integrations/postgres-extension.md
        reference/semantic-search-pgvector.md: integrations/semantic-search.md
        reference/versioning-and-releases.md: project/releases.md
        ops/branch-protection.md: project/branch-protection.md
        ops/rls-demo.md: examples/rls-demo.md
        case-studies/01-query-optimization.md: examples/query-optimization.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false

# Ordered by what a reader needs next: learn the model, run it, investigate,
# integrate, secure and operate, look things up, then change the code.
# tools/docscheck fails the build if a page under docs/ is missing from here.
