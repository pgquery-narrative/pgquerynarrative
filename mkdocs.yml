site_name: PgQueryNarrative
site_description: PostgreSQL query intelligence — safe read-only SQL, plan analysis, and evidence-backed reports.

# site_url is the canonical address of the *published documentation*, used for
# canonical tags and sitemap.xml. There is no docs host yet, so it stays unset
# rather than pointing at the repository — a repo URL there emits canonical tags
# claiming every page lives at github.com, which is worse than having none.
# Set it when docs are actually hosted somewhere.

# repo_url / repo_name are top-level MkDocs settings; the theme reads them to
# render the repository link in the header. They were previously under `extra`,
# where MkDocs ignores them, so the link never appeared.
repo_url: https://github.com/pgquery-narrative/pgquerynarrative
repo_name: pgquery-narrative/pgquerynarrative
edit_uri: edit/main/docs/

# docs/README.md duplicates index.md for people browsing the repo on GitHub.
# It is not part of the built site, and saying so here keeps the build clean.
# The leading slash anchors this to the docs root: docs/api/README.md is a real
# nav page and must keep building.
exclude_docs: |
  /README.md

# Broken links and anchors are errors, not notes. Without this they are logged
# at INFO and --strict lets them through, which is how a docs gate ends up
# passing over links that 404.
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # Pages set explicit heading ids ("## LLM {#llm}") so cross-page anchors stay
  # stable when a heading is reworded. Without attr_list those braces render as
  # literal text in the heading and the id is never created, which is why the
  # #llm / #health-checks / #reports-and-llm links were all dead.
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false

nav:
  - Overview: index.md
  - Concepts: concepts.md
  - Trust model: trust-model.md
  - Getting started:
      - Quick start: getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Connect your PostgreSQL: getting-started/connect-postgres.md
      - LLM setup: getting-started/llm-setup.md
      - Embedded integration: getting-started/embedded.md
  - User guides:
      - UI overview: ui-overview.md
      - CLI usage: usage/cli-usage.md
  - Configuration: configuration.md
  - API:
      - API reference: api/README.md
      - Examples: api/examples.md
  - Reference:
      - Deployment: reference/deployment.md
      - Operations: reference/operations.md
      - Troubleshooting: reference/troubleshooting.md
      - PostgreSQL extension: reference/postgres-extension.md
      - Semantic search (pgvector): reference/semantic-search-pgvector.md
      - Versioning and releases: reference/versioning-and-releases.md
      - Dataset and schema: DATASET.md
  - Operations:
      - Branch protection: ops/branch-protection.md
      - RLS demo: ops/rls-demo.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Dev runbook: development/runbook.md
  - Case studies:
      - Query optimization: case-studies/01-query-optimization.md
