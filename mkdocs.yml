      - Installation: getting-started/installation.md
      - Connect your PostgreSQL: getting-started/connect-postgres.md
      - "Quick start: pqn (extension)": getting-started/pqn-extension.md
      - Install the pqn extension: getting-started/pqn-installation.md
  - Query investigation:
