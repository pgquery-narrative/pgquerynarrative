version: 2
updates:
  # Go modules Dependabot cannot update this private repo: the module path
  # github.com/pgquerynarrative/pgquerynarrative is unreachable to the updater
  # (git_dependencies_not_reachable), which fails Dependabot Updates on main.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    # typescript 7 conflicts with typescript-eslint peer range; bump deliberately.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /test/playwright
    schedule:
      interval: weekly
    labels:
      - dependencies
      - e2e
    groups:
      playwright-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
    # download-artifact is not referenced in workflows; Dependabot still probes it
    # and fails the Updates job with unknown_error, turning main red.
    ignore:
      - dependency-name: "actions/download-artifact"
    open-pull-requests-limit: 5
