name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      publish:
        description: 'Create GitHub release (false = build-only verification)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "VERSION=${VER#v}" >> $GITHUB_ENV
      - name: Build server (CGO required for pg_query)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && '-DHAVE_STRCHRNUL' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.goos == 'darwin' && '15.4' || '' }}
        run: |
          if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "amd64" ] && [ "$(uname -m)" = "arm64" ]; then
            SDK="$(xcrun --show-sdk-path)"
            export CC="clang -arch x86_64 -isysroot ${SDK}"
            export CXX="clang++ -arch x86_64 -isysroot ${SDK}"
          fi
          go build -ldflags "-X main.Version=$VERSION" \
            -o pgquerynarrative-server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/server
      - name: Build MCP server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X main.Version=$VERSION" \
            -o pgquerynarrative-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mcp-server
      - name: Build migrate binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -tags postgres -ldflags "-s -w" \
            -o pgquerynarrative-migrate-${{ matrix.goos }}-${{ matrix.goarch }} \
            github.com/golang-migrate/migrate/v4/cmd/migrate
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            pgquerynarrative-server-${{ matrix.goos }}-${{ matrix.goarch }}
            pgquerynarrative-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            pgquerynarrative-migrate-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgquerynarrative
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download build artifacts
        uses: actions/download-artifact@65a9edc588144a91c09efa18addce5f7ff05fc9b
        with:
          path: artifacts
          merge-multiple: true
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "VERSION=${VER#v}" >> $GITHUB_ENV
      - name: Package release assets
        run: |
          mkdir -p bin packages
          mv artifacts/pgquerynarrative-* bin/
          for server in bin/pgquerynarrative-server-*; do
            target="${server#bin/pgquerynarrative-server-}"
            mcp="bin/pgquerynarrative-mcp-${target}"
            migrate="bin/pgquerynarrative-migrate-${target}"
            pkg="packages/pgquerynarrative-${VERSION}-${target}"
            mkdir -p "$pkg/bin" "$pkg/frontend" "$pkg/app/db" "$pkg/config"
            cp "$server" "$pkg/bin/pgquerynarrative-server"
            cp "$mcp" "$pkg/bin/pgquerynarrative-mcp"
            cp "$migrate" "$pkg/bin/migrate"
            cp -R frontend/dist "$pkg/frontend/dist"
            cp -R app/db/migrations "$pkg/app/db/migrations"
            cp .env.example "$pkg/config/pgquerynarrative.env.example"
            cp tools/docker/entrypoint.sh "$pkg/bin/entrypoint.sh"
            chmod +x "$pkg/bin/pgquerynarrative-server" "$pkg/bin/pgquerynarrative-mcp" "$pkg/bin/migrate" "$pkg/bin/entrypoint.sh"
            tar -C packages -czf "bin/pgquerynarrative-${VERSION}-${target}.tar.gz" "pgquerynarrative-${VERSION}-${target}"
          done
          (cd bin && sha256sum *.tar.gz > checksums.txt)
          ls -la bin
      - name: Smoke test release archives (binary presence, all platforms)
        run: |
          for archive in bin/pgquerynarrative-${VERSION}-*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            dest="/tmp/pgqn-release-smoke/${target}"
            mkdir -p "$dest"
            tar -xzf "$archive" -C "$dest"
            pkg="$dest/${target}"
            echo "Checking ${pkg}..."
            test -x "$pkg/bin/pgquerynarrative-server"
            test -x "$pkg/bin/pgquerynarrative-mcp"
            test -x "$pkg/bin/migrate"
            test -f "$pkg/frontend/dist/index.html"
            test -d "$pkg/app/db/migrations"
            test -f "$pkg/config/pgquerynarrative.env.example"
            # migrate is cross-compiled per target platform; only exec it on linux/amd64 (the runner's own platform).
            if [ "$target" = "pgquerynarrative-${VERSION}-linux-amd64" ]; then
              "$pkg/bin/migrate" --help
            fi
          done
      - name: Full smoke test (migrate + server + health) on linux/amd64
        run: |
          PKG_DIR="/tmp/pgqn-release-smoke/pgquerynarrative-${VERSION}-linux-amd64/pgquerynarrative-${VERSION}-linux-amd64"

          echo "Initializing database roles/schemas..."
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pgquerynarrative -f infra/postgres-init/00-init.sql

          echo "Running packaged migrate binary against PostgreSQL service container..."
          DB_URL="postgres://pgquerynarrative_app:pgquerynarrative_app@127.0.0.1:5432/pgquerynarrative?sslmode=disable"
          "$PKG_DIR/bin/migrate" -path "$PKG_DIR/app/db/migrations" -database "$DB_URL" up

          echo "Starting packaged server..."
          export DATABASE_HOST=127.0.0.1 DATABASE_PORT=5432
          export DATABASE_NAME=pgquerynarrative
          export DATABASE_USER=pgquerynarrative_app DATABASE_PASSWORD=pgquerynarrative_app
          export DATABASE_READONLY_USER=pgquerynarrative_readonly DATABASE_READONLY_PASSWORD=pgquerynarrative_readonly
          export SECURITY_AUTH_ENABLED=false
          export SECURITY_ALLOW_INSECURE_NO_AUTH=true
          export PGQUERYNARRATIVE_PORT=8080 PGQUERYNARRATIVE_HOST=127.0.0.1
          (cd "$PKG_DIR" && exec ./bin/pgquerynarrative-server) >/tmp/pgqn-release-smoke.log 2>&1 &
          SERVER_PID=$!

          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "❌ Server did not become healthy"
            cat /tmp/pgqn-release-smoke.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Packaged server is healthy"
          kill "$SERVER_PID" 2>/dev/null || true
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: bin/
          format: spdx-json
          output-file: bin/sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign release artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for artifact in bin/*.tar.gz bin/checksums.txt bin/sbom.spdx.json; do
            cosign sign-blob --yes "$artifact" --output-signature "${artifact}.sig" --output-certificate "${artifact}.cert"
          done
          ls -la bin/*.sig bin/*.cert || true
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: bin/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Publish OCI image
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "VERSION=${VER#v}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          sbom: true
          provenance: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign OCI image by digest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build_push.outputs.digest }}"
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}@${DIGEST}"
