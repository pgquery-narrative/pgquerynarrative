name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent direct pushes to main (security best practice)
# This should be enforced via branch protection rules in GitHub settings

jobs:
  # Code quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Check generated code is committed
        run: |
          git diff --exit-code api/gen/ frontend/src/api/schema.gen.ts || (
            echo "Generated code is out of date. Run 'make generate' and commit api/gen/ + frontend/src/api/schema.gen.ts."
            git diff --stat api/gen/ frontend/src/api/schema.gen.ts
            exit 1
          )
      - name: Run lint
        run: make lint
      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'make fmt'"
            gofmt -s -d .
            exit 1
          fi
      - name: Check pinned action SHAs resolve
        # release.yml only runs on a tag push, so a pinned SHA that does not exist
        # upstream stays invisible until someone cuts a release and the job dies in
        # "Set up job" before a single step runs. That is exactly how v2.1.0 failed:
        # actions/download-artifact was pinned to a SHA that was not in the action's
        # repository at all. Resolve every pin on every PR instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          rc=0
          # The repo component must allow "/" so multi-segment action paths are
          # covered too (github/codeql-action/init@SHA); the API lookup uses the
          # first two segments either way. A pattern that stops at owner/repo
          # silently skips every codeql-action pin in security.yml.
          pins="$(grep -ohE 'uses: [A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+@[a-f0-9]{40}' \
                  .github/workflows/*.yml | sed 's/uses: //' | sort -u)"
          if [ -z "$pins" ]; then
            echo "No pinned action SHAs matched — the extraction pattern is wrong."
            exit 1
          fi

          # Resolving the SHAs that ARE present says nothing about an action that
          # was never pinned in the first place: a workflow written as
          # actions/setup-node@v7 simply does not appear in "$pins", so a mutable
          # major tag used to pass this check unnoticed. Reject any external
          # `uses:` whose ref is not a 40-hex SHA. Local actions (./...) and
          # reusable workflows in this repo are exempt — they are already pinned
          # by the commit being built.
          # The ref must start with an alphanumeric so a local "./.github/..."
          # path (which cannot be tampered with upstream) is not flagged.
          unpinned="$(grep -nhE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_.-]*/' \
                      .github/workflows/*.yml .github/actions/*/*.yml 2>/dev/null \
                      | grep -vE '@[a-f0-9]{40}([[:space:]]|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "External actions must be pinned to an immutable 40-character commit SHA."
            echo "A mutable tag (@v1, @main) lets the action's owner change what runs here."
            echo "$unpinned"
            rc=1
          fi

          for pin in $pins; do
            path="${pin%@*}"; sha="${pin##*@}"
            owner="${path%%/*}"; rest="${path#*/}"; repo="${rest%%/*}"

            # Only 404/422 mean the SHA is genuinely absent. Every other failure
            # (403/429 rate limit, 5xx incident, network) is transient, and failing
            # the build on those would wedge every open PR behind GitHub's uptime
            # for a check that is required by branch protection. Retry, then report
            # the pin as unverified without failing.
            status=""
            for attempt in 1 2 3; do
              out="$(gh api "repos/$owner/$repo/commits/$sha" 2>&1)" && { status=200; break; }
              status="$(printf '%s' "$out" \
                | sed -n -e 's/.*(HTTP \([0-9]\{3\}\)).*/\1/p' \
                         -e 's/.*"status":"\([0-9]\{3\}\)".*/\1/p' | head -1)"
              case "$status" in
                404|422) break ;;
                *) sleep $(( attempt * 3 )) ;;
              esac
            done

            case "$status" in
              200)     echo "ok        $path@${sha:0:10}" ;;
              404|422) echo "MISSING   $path@$sha"; rc=1 ;;
              *)       echo "UNKNOWN   $path@${sha:0:10} (could not verify: ${status:-network})" ;;
            esac
          done

          if [ "$rc" -ne 0 ]; then
            echo
            echo "A pinned action SHA does not exist upstream. Re-pin it to a real commit"
            echo "for the intended version tag."
            exit 1
          fi

  # Unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Run unit and integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          CGO_ENABLED: "1"
        run: make test
      - name: Collect coverage
        env:
          CGO_ENABLED: "1"
        run: |
          go test -coverprofile=coverage.out -covermode=atomic \
            ./app/queryrunner/... ./app/config/... ./app/auth/... ./app/llm/... \
            ./app/security/... ./pkg/narrative/... ./cmd/server/... ./test/unit/...
          go tool cover -func=coverage.out | tail -1
          total="$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')"
          echo "Core package coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 35) { print "Coverage below 35% floor on core packages: " t "%"; exit 1 } }'
      - name: Enforce per-package coverage floors (auth, queryrunner, security)
        env:
          CGO_ENABLED: "1"
        run: |
          set -e
          # Coverage is measured against the package's own code (-coverpkg) while running both
          # its in-package tests and the corresponding black-box suite under test/unit/app/<pkg>,
          # since most of these packages are tested externally from test/unit.
          check_pkg_coverage() {
            pkg="$1"; floor="$2"
            name="$(basename "$pkg")"
            profile="cov_${name}.out"
            # Cover the package itself (not test doubles under subdirs like app/auth/mockoidc).
            go test -coverprofile="$profile" -covermode=atomic -coverpkg="$pkg" "$pkg" "./test/unit/app/$name/..."
            pct="$(go tool cover -func="$profile" | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
            echo "$pkg coverage: ${pct}% (floor ${floor}%)"
            awk -v t="$pct" -v f="$floor" -v p="$pkg" 'BEGIN { if (t+0 < f+0) { print "Coverage below floor for " p ": " t "% < " f "%"; exit 1 } }'
          }
          # Floors are ratchets, not targets: each sits a few points under the
          # measured value so an unrelated PR cannot quietly delete coverage, while
          # normal churn does not turn the gate red. Raise a floor when the real
          # number moves up, never lower one to make a build pass.
          check_pkg_coverage ./app/auth 35
          check_pkg_coverage ./app/queryrunner 65
          check_pkg_coverage ./app/security 50
          # llm has rich unit suite under test/unit/app/llm
          check_pkg_coverage ./app/llm 30
          # metrics: pure numeric primitives in calculator.go + black-box suite
          check_pkg_coverage ./app/metrics 65
          # service: integration-heavy; this floor covers the pure decision logic
          # (regression eval, fix transitions, error mapping, API converters,
          # schedule validation, SQL visibility). The DB-backed paths are covered
          # by test/integration, which does not feed this profile.
          check_pkg_coverage ./app/service 25
          # audit package tests are primarily in-package
          go test -coverprofile=cov_audit.out -covermode=atomic -coverpkg=./app/audit/... ./app/audit/...
          pct="$(go tool cover -func=cov_audit.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "./app/audit coverage: ${pct}% (floor 45%)"
          awk -v t="$pct" 'BEGIN { if (t+0 < 45) { print "Coverage below floor for ./app/audit: " t "% < 45%"; exit 1 } }'

  schedule-multireplica:
    name: Schedule multi-replica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
        with:
          go-version: '1.26.6'
      - name: Generate code
        run: make generate
      - name: Two-replica schedule claim + lease recovery
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          CGO_ENABLED: "1"
          DOCKER_API_VERSION: "1.44"
        run: |
          go test ./test/integration/ -run 'TestScheduleClaim_MultiReplicaIdempotent|TestScheduleLeaseRecovery_TwoReplicaCrashRecovery' -v -count=1

  db-security:
    name: DB security verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify readonly role boundaries
        run: |
          make postgres-up
          make migrate-docker
          make db-security-verify-docker

  helm-strict:
    name: Helm StrictMode gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3
      - name: Verify chart rejects unsafe defaults
        run: make helm-strict-check

  migration-cycle:
    name: Migration up/down/up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify migrations are reversible (up -> down -> up)
        run: make migrate-cycle-docker

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Run race detector on core packages
        env:
          CGO_ENABLED: "1"
        run: go test -race ./app/... ./pkg/narrative/... ./cmd/server/...

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        run: govulncheck ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build documentation with --strict
        run: make docs-check

  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: make build
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: binary
          path: bin/server
          retention-days: 1

  # Mirrors release.yml linux/amd64 CGO build (pg_query) on every push.
  release-smoke:
    name: Release build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Generate code
        run: make generate
      - name: Build release binaries (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-X main.Version=smoke" -o pgquerynarrative-server-linux-amd64 ./cmd/server
          CGO_ENABLED=0 go build -ldflags "-X main.Version=smoke" -o pgquerynarrative-mcp-linux-amd64 ./cmd/mcp-server
          CGO_ENABLED=0 go build -tags postgres -ldflags "-X main.Version=smoke" -o pgquerynarrative-migrate-linux-amd64 \
            github.com/golang-migrate/migrate/v4/cmd/migrate
          ls -la pgquerynarrative-*
      - name: Package and smoke release archive
        run: |
          VERSION=smoke
          target=linux-amd64
          pkg="pgquerynarrative-${VERSION}-${target}"
          mkdir -p "packages/${pkg}/bin" "packages/${pkg}/frontend" "packages/${pkg}/app/db" "packages/${pkg}/config"
          cp pgquerynarrative-server-linux-amd64 "packages/${pkg}/bin/pgquerynarrative-server"
          cp pgquerynarrative-mcp-linux-amd64 "packages/${pkg}/bin/pgquerynarrative-mcp"
          cp pgquerynarrative-migrate-linux-amd64 "packages/${pkg}/bin/migrate"
          cp -R frontend/dist "packages/${pkg}/frontend/dist"
          cp -R app/db/migrations "packages/${pkg}/app/db/migrations"
          cp .env.example "packages/${pkg}/config/pgquerynarrative.env.example"
          chmod +x "packages/${pkg}/bin/pgquerynarrative-server" "packages/${pkg}/bin/pgquerynarrative-mcp" "packages/${pkg}/bin/migrate"
          tar -C packages -czf "${pkg}.tar.gz" "${pkg}"
          mkdir -p /tmp/pgqn-smoke
          tar -xzf "${pkg}.tar.gz" -C /tmp/pgqn-smoke
          test -x "/tmp/pgqn-smoke/${pkg}/bin/pgquerynarrative-server"
          test -x "/tmp/pgqn-smoke/${pkg}/bin/pgquerynarrative-mcp"
          test -x "/tmp/pgqn-smoke/${pkg}/bin/migrate"
          test -f "/tmp/pgqn-smoke/${pkg}/frontend/dist/index.html"
          test -d "/tmp/pgqn-smoke/${pkg}/app/db/migrations"
          test -f "/tmp/pgqn-smoke/${pkg}/config/pgquerynarrative.env.example"
          "/tmp/pgqn-smoke/${pkg}/bin/migrate" --help

  playwright:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/setup-go-cgo
      - name: Start Postgres and migrate
        run: |
          make postgres-up
          make migrate-docker
      - name: Playwright smoke (UI + health)
        run: make test-playwright
      - name: Playwright OIDC browser login
        run: make test-playwright-oidc
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: test/playwright/playwright-report/
          retention-days: 7

  load-smoke:
    name: Load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Start Postgres and migrate
        run: |
          make postgres-up
          make migrate-docker
      - name: Generate code
        run: make generate
      - name: Build and start server
        run: |
          CGO_ENABLED=1 go build -o bin/server ./cmd/server
          export DATABASE_HOST=localhost DATABASE_PORT=5432
          export DATABASE_USER=pgquerynarrative_app DATABASE_PASSWORD=pgquerynarrative_app
          export DATABASE_NAME=pgquerynarrative
          export DATABASE_READONLY_USER=pgquerynarrative_readonly DATABASE_READONLY_PASSWORD=pgquerynarrative_readonly
          export SECURITY_AUTH_ENABLED=false
          export SECURITY_ALLOW_INSECURE_NO_AUTH=true
          export PGQUERYNARRATIVE_PORT=8080
          ./bin/server >/tmp/pgqn-load-smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/health
      - name: Run load smoke
        run: |
          chmod +x test/load/smoke.sh
          LOAD_BASE_URL=http://127.0.0.1:8080 LOAD_REQUESTS=30 ./test/load/smoke.sh

  docker-image:
    name: Docker image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      # Builds the single blessed image (API + SPA) the release workflow publishes.
      # Without this, a Dockerfile regression is only found when a tag is cut.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: pgquerynarrative:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert the image is the single-image model
        run: |
          set -euo pipefail
          # The SPA must be bundled: a release image that serves an empty UI is the
          # exact failure the single-image model exists to prevent.
          docker run --rm --entrypoint sh pgquerynarrative:ci -c \
            'test -s /app/frontend/dist/index.html' \
            || { echo "::error::/app/frontend/dist/index.html missing — image does not bundle the SPA"; exit 1; }
          # Files the entrypoint dereferences must exist, or startup fails at runtime.
          docker run --rm --entrypoint sh pgquerynarrative:ci -c \
            'test -x /app/bin/server && test -x /app/bin/migrate && test -s /app/tools/db/seed.sql && test -d /app/app/db/migrations' \
            || { echo "::error::image is missing a binary, migrations, or the seed file"; exit 1; }
          # Must not run as root.
          uid="$(docker run --rm --entrypoint sh pgquerynarrative:ci -c 'id -u')"
          test "$uid" != "0" || { echo "::error::image runs as root"; exit 1; }
          echo "image OK: SPA bundled, entrypoint inputs present, non-root (uid $uid)"
