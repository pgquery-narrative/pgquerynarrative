name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays
    - cron: '0 0 * * 0'

jobs:
  supply-chain:
    name: Supply Chain Baseline
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cgo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/playwright/package-lock.json
      - name: Verify Go module checksums
        run: go mod verify
      - name: Audit frontend dependencies
        working-directory: frontend
        run: ../.github/scripts/npm-audit-resilient.sh
      - name: Audit Playwright dependencies
        working-directory: test/playwright
        run: ../../.github/scripts/npm-audit-resilient.sh
      - name: Audit Python tooling dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r tools/db/requirements-nyc.txt
      - name: OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && hashFiles('scorecard.sarif') != ''
        with:
          sarif_file: scorecard.sarif

  # Secret scanning - GitHub automatically scans, but we can add explicit checks
  # Only run on PRs so BASE and HEAD differ (TruffleHog requires different commits)
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Dependency vulnerability scanning
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  # CodeQL security analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370

  # Security audit with gosec
  gosec:
    name: Go Security Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Run gosec (blocking on high severity/confidence findings)
        uses: securego/gosec@a7abd50b2947e53b26a7e200223e635ce36fac9b
        with:
          # No -no-fail: the job fails when issues remain after filtering. Filtered to
          # high severity + high confidence so pre-existing low/medium findings (tracked
          # separately) don't block every PR; raise this bar over time as they're fixed.
          args: '-severity high -confidence high -fmt json -out gosec-report.json ./...'
      - name: Upload gosec results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gosec-report
          path: gosec-report.json
