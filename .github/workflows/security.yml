name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Sundays
    - cron: '0 0 * * 0'

jobs:
  supply-chain:
    name: Supply Chain Baseline
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-cgo
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/playwright/package-lock.json
      - name: Verify Go module checksums
        run: go mod verify
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Audit Playwright dependencies
        working-directory: test/playwright
        run: npm audit --audit-level=high
      - name: Audit Python tooling dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r tools/db/requirements-nyc.txt
      - name: OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        if: always() && hashFiles('scorecard.sarif') != ''
        with:
          sarif_file: scorecard.sarif

  # Secret scanning - GitHub automatically scans, but we can add explicit checks
  # Only run on PRs so BASE and HEAD differ (TruffleHog requires different commits)
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Dependency vulnerability scanning
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  # CodeQL security analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  # Security audit with gosec
  gosec:
    name: Go Security Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-go-cgo
      - name: Install dependencies
        run: go mod download
      - name: Generate code
        run: make generate
      - name: Run gosec (blocking on high severity/confidence findings)
        uses: securego/gosec@4d447d9bf750776ec436724dcaf728e5c629f2f6
        with:
          # No -no-fail: the job fails when issues remain after filtering. Filtered to
          # high severity + high confidence so pre-existing low/medium findings (tracked
          # separately) don't block every PR; raise this bar over time as they're fixed.
          args: '-severity high -confidence high -fmt json -out gosec-report.json ./...'
      - name: Upload gosec results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gosec-report
          path: gosec-report.json
