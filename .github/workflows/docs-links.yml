name: Docs external links

# External (http/https) links in README, docs/ and .github/*.md. Internal links
# and anchors are gated by the `Docs` job in ci.yml (mkdocs --strict +
# tools/docscheck); this workflow covers what neither can see.
#
# Deliberately NOT a required check: it is path-filtered (a required check that
# does not run on a PR blocks that PR forever) and it depends on third-party
# servers. It still fails loudly on a link that is persistently broken, and the
# weekly run catches link rot on pages nobody touched.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'RELEASING.md'
      - 'deploy/README.md'
      - 'docs/**'
      - '.github/*.md'
      - '.lychee.toml'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'RELEASING.md'
      - 'deploy/README.md'
      - 'docs/**'
      - '.github/*.md'
      - '.lychee.toml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Docs external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Cache results for a day so reruns and busy weeks do not hammer the same
      # hosts (fewer rate limits, fewer spurious failures).
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --config .lychee.toml --cache --max-cache-age 1d --no-progress
            README.md RELEASING.md deploy/README.md '.github/*.md' 'docs/**/*.md'
          fail: true
        env:
          # Authenticated GitHub requests get a far higher rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
