components:
  schemas:
    AddCandidatePayload:
      type: object
      properties:
        analyze:
          type: boolean
          default: false
        binds:
          type: array
          items:
            type: string
          description: Sample bind values for a parameterized candidate ($1, $2, ...); used only for the compare/equivalence run, not stored
        candidate_sql:
          type: string
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
        id:
          type: string
          format: uuid
        verify_results:
          type: boolean
          description: Execute the candidate and the original to check result equivalence. Requires the `query` permission on the connection.
          default: false
      required:
        - id
        - candidate_sql
    AddCandidatePayload2:
      type: object
      properties:
        analyze:
          type: boolean
          default: false
        binds:
          type: array
          items:
            type: string
          description: Sample bind values for a parameterized candidate ($1, $2, ...); used only for the compare/equivalence run, not stored
        candidate_sql:
          type: string
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
        verify_results:
          type: boolean
          description: Execute the candidate and the original to check result equivalence. Requires the `query` permission on the connection.
          default: false
      required:
        - candidate_sql
    AggregateData:
      type: object
      properties:
        avg:
          type: number
          format: double
        count:
          type: integer
          format: int32
        max:
          type: number
          format: double
        min:
          type: number
          format: double
        std_dev:
          type: number
          description: Standard deviation (stats)
          format: double
        sum:
          type: number
          format: double
    AnomalyPointData:
      type: object
      properties:
        explanation:
          type: string
          description: One-sentence explanation for why this period may be anomalous
        period_label:
          type: string
        reason:
          type: string
        value:
          type: number
          format: double
      required:
        - period_label
        - value
        - reason
    AskRequestBody:
      type: object
      properties:
        connection_id:
          type: string
          description: Optional connection ID; defaults to server default connection
        question:
          type: string
          description: Natural-language question (e.g. 'What were top 5 products by revenue last month?')
          minLength: 1
          maxLength: 1000
      required:
        - question
    AskResult:
      type: object
      properties:
        question:
          type: string
          description: The original natural-language question
        report:
          $ref: '#/components/schemas/Report'
        sql:
          type: string
          description: The generated and executed SQL
      required:
        - question
        - sql
        - report
    ChartSuggestion:
      type: object
      properties:
        chart_type:
          type: string
          description: 'Chart type identifier: bar, line, pie, area, table'
        label:
          type: string
          description: Human-readable label
        reason:
          type: string
          description: Why this chart fits the data
      required:
        - chart_type
        - label
        - reason
    ChatRequestBody:
      type: object
      properties:
        connection_id:
          type: string
          description: Optional connection ID; defaults to server default connection
        question:
          type: string
          minLength: 1
          maxLength: 1000
        session_id:
          type: string
      required:
        - question
    ChatResult:
      type: object
      properties:
        follow_ups:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/ChatTurn'
        question:
          type: string
        report:
          $ref: '#/components/schemas/Report'
        session_id:
          type: string
        sql:
          type: string
      required:
        - session_id
        - question
        - sql
        - report
        - history
        - follow_ups
    ChatTurn:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        question:
          type: string
        sql:
          type: string
      required:
        - question
        - sql
        - created_at
    CohortMetricData:
      type: object
      properties:
        cohort_label:
          type: string
        periods:
          type: array
          items:
            $ref: '#/components/schemas/CohortPeriodPointData'
        retention_pct:
          type: number
          format: double
      required:
        - cohort_label
    CohortPeriodPointData:
      type: object
      properties:
        period_label:
          type: string
        value:
          type: number
          format: double
      required:
        - period_label
        - value
    ColumnInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required:
        - name
        - type
    ColumnQualityData:
      type: object
      properties:
        distinct_count:
          type: integer
          format: int32
        null_count:
          type: integer
          format: int32
        null_pct:
          type: number
          description: Null percentage 0–100
          format: double
        total_rows:
          type: integer
          format: int32
      required:
        - null_count
        - distinct_count
        - total_rows
        - null_pct
    ComparePlansPayload:
      type: object
      properties:
        after_sql:
          type: string
          description: Candidate SQL to explain
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
        analyze:
          type: boolean
          description: Run EXPLAIN ANALYZE when enabled server-side
          default: false
        before_sql:
          type: string
          description: Original SQL to explain
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
        binds:
          type: array
          items:
            type: string
          description: Sample bind values for parameterized before/after SQL ($1, $2, ...); substituted for the compare/equivalence run
        connection_id:
          type: string
          description: Optional connection ID
        verify_results:
          type: boolean
          description: Execute both queries (COUNT(*) + bounded sample) to check result equivalence. Requires the `query` permission on the connection; off by default so a compare only plans.
          default: false
      required:
        - before_sql
        - after_sql
    ComparePlansResult:
      type: object
      properties:
        after:
          $ref: '#/components/schemas/ExplainQueryResult'
        before:
          $ref: '#/components/schemas/ExplainQueryResult'
        diff:
          $ref: '#/components/schemas/PlanComparisonDiff'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/PlanComparisonMetric'
        result_after_row_count:
          type: integer
          description: COUNT(*) of after SQL when computable
          format: int64
        result_before_row_count:
          type: integer
          description: COUNT(*) of before SQL when computable
          format: int64
        result_checksum_equal:
          type: boolean
          description: True when results match; false when they differ; omitted/null when unverified
        result_equivalence_notes:
          type: string
          description: Human-readable equivalence caveats (COUNT(*), sample size, failures)
        result_equivalence_status:
          type: string
          description: How far result equivalence was checked
          enum:
            - VerifiedEqual
            - SampleMatch
            - Different
            - Unverified
            - NotRequested
        result_sample_rows:
          type: integer
          description: Rows compared in the multiset sample
          format: int32
      required:
        - before
        - after
        - metrics
        - diff
    ConnectionInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    ConnectionListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionInfo'
      required:
        - items
    CorrelationPairData:
      type: object
      properties:
        column_a:
          type: string
        column_b:
          type: string
        pearson:
          type: number
          description: Pearson correlation -1 to 1
          format: double
        spearman:
          type: number
          description: Spearman rank correlation -1 to 1
          format: double
      required:
        - column_a
        - column_b
        - pearson
        - spearman
    CreateFromRegressionRequestBody:
      type: object
      properties:
        regression_alert_id:
          type: string
          format: uuid
      required:
        - regression_alert_id
    CreateInvestigationPayload:
      type: object
      properties:
        analyze:
          type: boolean
          description: Run EXPLAIN ANALYZE (executes the query) instead of an estimate-only plan
          default: false
        calls:
          type: integer
          format: int64
        connection_id:
          type: string
        mean_time_ms:
          type: number
          format: double
        queryid:
          type: string
          description: Optional pg_stat_statements queryid for context
        rows:
          type: integer
          format: int64
        sql:
          type: string
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
        title:
          type: string
          minLength: 1
          maxLength: 200
        total_time_ms:
          type: number
          format: double
      required:
        - title
        - sql
    CreateRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - name
    CreateShareRequestBody:
      type: object
      properties:
        expires_in_hours:
          type: integer
          description: Optional expiry in hours (1-720). Omit for no expiry.
          format: int32
          minimum: 1
          maximum: 720
        report_id:
          type: string
          format: uuid
      required:
        - report_id
    Dashboard:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
      required:
        - id
        - name
        - widgets
        - created_at
        - updated_at
    DashboardListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dashboard'
      required:
        - items
    DashboardResolved:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardResolvedWidget'
      required:
        - id
        - name
        - widgets
    DashboardResolvedWidget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        refresh_seconds:
          type: integer
          format: int32
        report:
          $ref: '#/components/schemas/Report'
        saved_query:
          $ref: '#/components/schemas/SavedQuery'
        title:
          type: string
        widget_type:
          type: string
      required:
        - id
        - widget_type
        - refresh_seconds
        - position
    DashboardWidget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        refresh_seconds:
          type: integer
          format: int32
        report_id:
          type: string
          format: uuid
        saved_query_id:
          type: string
          format: uuid
        title:
          type: string
        widget_type:
          type: string
      required:
        - id
        - widget_type
        - refresh_seconds
        - position
    DashboardWidgetInput:
      type: object
      properties:
        position:
          type: integer
          format: int32
        refresh_seconds:
          type: integer
          format: int32
        report_id:
          type: string
          format: uuid
        saved_query_id:
          type: string
          format: uuid
        title:
          type: string
        widget_type:
          type: string
      required:
        - widget_type
    DemoScenario:
      type: object
      properties:
        candidate_sql:
          type: string
          description: Verified improvement query
        category:
          type: string
          description: e.g. function_wrap, partition_pruning, cardinality
        expected_improvement:
          type: string
          description: e.g. 8.4s → 310ms
        id:
          type: string
        problem:
          type: string
          description: Short business problem
        sql:
          type: string
          description: Reproducible query
        title:
          type: string
      required:
        - id
        - title
        - problem
        - sql
        - expected_improvement
        - category
    DemoScenarioList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DemoScenario'
      required:
        - items
    ExplainQueryPayload:
      type: object
      properties:
        analyze:
          type: boolean
          description: When true, run EXPLAIN (ANALYZE, FORMAT JSON) instead of estimate-only
          default: false
        connection_id:
          type: string
          description: Optional connection ID; defaults to server default connection
        sql:
          type: string
          description: Read-only SQL to explain (SELECT or WITH)
          pattern: ^[^;]+$
          minLength: 1
          maxLength: 10000
      required:
        - sql
    ExplainQueryResult:
      type: object
      properties:
        diagnosis:
          $ref: '#/components/schemas/PlanDiagnosis'
        evidence_mode:
          type: string
          description: estimated (plan only) or observed (ANALYZE timings)
          enum:
            - estimated
            - observed
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PlanFinding'
          description: Notable plan nodes (seq scans, high-cost operators)
        generic_plan:
          type: boolean
          description: True when the plan came from EXPLAIN (GENERIC_PLAN) because the query is parameterized ($1, $2, ...)
        plan:
          description: Raw EXPLAIN (FORMAT JSON) output
        planning_time_ms:
          type: number
          description: PostgreSQL's own Planning Time for the statement
          format: double
        request_wall_time_ms:
          type: integer
          description: Wall-clock time this server spent issuing the EXPLAIN and parsing the plan — network + planning + (for ANALYZE) execution. NOT the query's execution time.
          format: int64
        server_execution_time_ms:
          type: number
          description: PostgreSQL's own Execution Time — non-zero only when ANALYZE actually ran the query
          format: double
        sql:
          type: string
          description: The inner read-only SQL that was explained
        total_cost:
          type: number
          description: Estimated total cost from the root plan node
          format: double
      required:
        - sql
        - total_cost
        - plan
        - findings
        - request_wall_time_ms
        - evidence_mode
