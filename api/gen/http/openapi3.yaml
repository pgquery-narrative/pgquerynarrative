openapi: 3.0.3
info:
  title: PgQueryNarrative API
  description: 'Postgres-native query intelligence: secure read-only SQL, EXPLAIN plan analysis, and optional AI narratives'
  version: v1
servers:
  - url: http://localhost:8080
paths:
  /api/v1/connections:
    get:
      tags:
        - connections
      summary: list connections
      description: List configured data connections (id and display name only)
      operationId: connections#list
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResult'
  /api/v1/dashboards:
    get:
      tags:
        - dashboards
      summary: list dashboards
      operationId: dashboards#list
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardListResult'
    post:
      tags:
        - dashboards
      summary: create dashboards
      operationId: dashboards#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /api/v1/dashboards/{id}:
    delete:
      tags:
        - dashboards
      summary: delete dashboards
      operationId: dashboards#delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content response.
    get:
      tags:
        - dashboards
      summary: get dashboards
      operationId: dashboards#get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    put:
      tags:
        - dashboards
      summary: update dashboards
      operationId: dashboards#update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/dashboards/{id}/resolve:
    get:
      tags:
        - dashboards
      summary: resolve dashboards
      operationId: dashboards#resolve
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResolved'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/demo/scenarios:
    get:
      tags:
        - workspace
      summary: demo_scenarios workspace
      description: Guided demo scenarios for Query Investigation
      operationId: workspace#demo_scenarios
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoScenarioList'
  /api/v1/investigations:
    get:
      tags:
        - investigations
      summary: list investigations
      description: List query investigations for the current organization
      operationId: investigations#list
      parameters:
        - name: limit
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 20
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 0
            format: int32
            minimum: 0
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationList'
    post:
      tags:
        - investigations
      summary: create investigations
      description: Start a new query investigation from SQL or pg_stat_statements context
      operationId: investigations#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/investigations/{id}:
    get:
      tags:
        - investigations
      summary: get investigations
      description: Get a query investigation with evidence
      operationId: investigations#get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/{id}/candidate:
    post:
      tags:
        - investigations
      summary: add_candidate investigations
      description: Add a candidate rewrite and compare plans
      operationId: investigations#add_candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCandidatePayload2'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/{id}/fix:
    post:
      tags:
        - investigations
      summary: update_fix investigations
      description: Advance the fix lifecycle (proposed -> verified -> applied) and record a PR/ticket link. Marking 'applied' snapshots the query's current latency so the poller can confirm the fix.
      operationId: investigations#update_fix
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFixPayload2'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/{id}/rank-candidates:
    post:
      tags:
        - investigations
      summary: rank_candidates investigations
      description: Generate rewrite and index-DDL candidates, dry-EXPLAIN rewrites, project index cost (hypopg or honest heuristic), and rank by cost/partitions
      operationId: investigations#rank_candidates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankCandidatesRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankedCandidateList'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/{id}/report:
    post:
      tags:
        - investigations
      summary: generate_report investigations
      description: Generate an engineering investigation report
      operationId: investigations#generate_report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/{id}/suggest-rewrite:
    post:
      tags:
        - investigations
      summary: suggest_rewrite investigations
      description: Suggest candidate SQL rewrites from the investigation SQL and plan findings (AST-based; no demo scenarios required)
      operationId: investigations#suggest_rewrite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewriteSuggestionList'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/investigations/from-regression:
    post:
      tags:
        - investigations
      summary: create_from_regression investigations
      description: Open an investigation from a regression alert (EXPLAIN + link alert to investigation)
      operationId: investigations#create_from_regression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFromRegressionRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/queries/explain:
    post:
      tags:
        - queries
      summary: explain_plan queries
      description: Run EXPLAIN (FORMAT JSON) on a read-only query and return plan analysis
      operationId: queries#explain_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainQueryPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainQueryResult'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/queries/explain/compare:
    post:
      tags:
        - queries
      summary: compare_plans queries
      description: Compare before and after execution plans for a query rewrite or index change
      operationId: queries#compare_plans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparePlansPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparePlansResult'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/queries/run:
    post:
      tags:
        - queries
      summary: run queries
      description: Execute a SQL query and return results
      operationId: queries#run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunQueryPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunQueryResult'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/queries/saved:
    get:
      tags:
        - queries
      summary: list_saved queries
      description: List saved queries
      operationId: queries#list_saved
      parameters:
        - name: tags
          in: query
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
        - name: connection_id
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: limit
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 50
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 0
            format: int32
            minimum: 0
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryList'
    post:
      tags:
        - queries
      summary: save queries
      description: Save a query
      operationId: queries#save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveQueryPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
  /api/v1/queries/saved/{id}:
    delete:
      tags:
        - queries
      summary: delete_saved queries
      description: Delete a saved query
      operationId: queries#delete_saved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content response.
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    get:
      tags:
        - queries
      summary: get_saved queries
      description: Get saved query by ID
      operationId: queries#get_saved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/queries/stats:
    get:
      tags:
        - queries
      summary: stat_statements queries
      description: List top queries from pg_stat_statements (read-only observability)
      operationId: queries#stat_statements
      parameters:
        - name: order_by
          in: query
          description: 'Sort key: total_time, mean_time, or calls'
          allowEmptyValue: true
          schema:
            type: string
            description: 'Sort key: total_time, mean_time, or calls'
            default: total_time
            enum:
              - total_time
              - mean_time
              - calls
        - name: limit
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 20
            format: int32
            minimum: 1
            maximum: 100
        - name: connection_id
          in: query
          description: Optional connection ID; defaults to server default connection
          allowEmptyValue: true
          schema:
            type: string
            description: Optional connection ID; defaults to server default connection
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatStatementsResult'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /api/v1/reports:
    get:
      tags:
        - reports
      summary: list reports
      description: List generated reports
      operationId: reports#list
      parameters:
        - name: saved_query_id
          in: query
          allowEmptyValue: true
          schema:
            type: string
            format: uuid
        - name: connection_id
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: limit
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 50
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 0
            format: int32
            minimum: 0
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
  /api/v1/reports/{id}:
    get:
      tags:
        - reports
      summary: get reports
      description: Get a report by ID
      operationId: reports#get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/reports/{report_id}/shares:
    get:
      tags:
        - reports
      summary: list_shares reports
      description: List active and revoked share links for a report. Never returns the raw token, only non-secret metadata.
      operationId: reports#list_shares
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportShareList'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/reports/generate:
    post:
      tags:
        - reports
      summary: generate reports
      description: Generate a narrative report from a SQL query
      operationId: reports#generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportPayload'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "500":
          description: 'llm_error: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMError'
  /api/v1/reports/rewrite:
    post:
      tags:
        - reports
      summary: rewrite reports
      description: Rewrite an existing report narrative using a user instruction.
      operationId: reports#rewrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrativeContent'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        "500":
          description: 'llm_error: Internal Server Error response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMError'
  /api/v1/reports/share:
    post:
      tags:
        - reports
      summary: create_share reports
      description: Create or refresh a shareable read-only token link for a report.
      operationId: reports#create_share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequestBody'
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportShareLink'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/reports/shared/{token}:
    get:
      tags:
        - reports
      summary: get_shared reports
      description: Fetch a report by valid share token.
      operationId: reports#get_shared
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 12
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/reports/shares/{id}/revoke:
    post:
      tags:
        - reports
      summary: revoke_share reports
      description: Revoke a share link so it can no longer be used to fetch its report.
      operationId: reports#revoke_share
      parameters:
        - name: id
          in: path
          description: Share link ID (not the token)
          required: true
          schema:
            type: string
            description: Share link ID (not the token)
            format: uuid
      responses:
        "200":
          description: OK response.
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/reports/similar:
    get:
      tags:
        - reports
      summary: similar reports
      description: Find reports semantically similar to input text
      operationId: reports#similar
      parameters:
        - name: text
          in: query
          allowEmptyValue: true
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2000
        - name: connection_id
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: limit
          in: query
          allowEmptyValue: true
          schema:
            type: integer
            default: 5
            format: int32
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSimilarResult'
  /api/v1/schedule-runs/{run_id}/retry:
    post:
      tags:
        - schedules
      summary: retry_run schedules
      operationId: schedules#retry_run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleRunRecord'
        "400":
          description: 'validation_error: Bad Request response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        "404":
          description: 'not_found: Not Found response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/v1/schedules:
    get:
      tags:
        - schedules
      summary: list schedules
      operationId: schedules#list
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResult'
    post:
      tags:
        - schedules
      summary: create schedules
      operationId: schedules#create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        "200":
