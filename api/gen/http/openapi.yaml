swagger: "2.0"
info:
  title: PgQueryNarrative API
  description: 'Postgres-native query intelligence: secure read-only SQL, EXPLAIN plan analysis, and optional AI narratives'
  version: v1
host: localhost:8080
consumes:
  - application/json
  - application/xml
  - application/gob
produces:
  - application/json
  - application/xml
  - application/gob
paths:
  /api/v1/connections:
    get:
      tags:
        - connections
      summary: list connections
      description: List configured data connections (id and display name only)
      operationId: connections#list
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ConnectionListResult'
            required:
              - items
      schemes:
        - http
  /api/v1/dashboards:
    get:
      tags:
        - dashboards
      summary: list dashboards
      operationId: dashboards#list
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/DashboardListResult'
            required:
              - items
      schemes:
        - http
    post:
      tags:
        - dashboards
      summary: create dashboards
      operationId: dashboards#create
      parameters:
        - name: CreateRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/DashboardsCreateRequestBody'
            required:
              - name
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Dashboard'
            required:
              - id
              - name
              - widgets
              - created_at
              - updated_at
      schemes:
        - http
  /api/v1/dashboards/{id}:
    get:
      tags:
        - dashboards
      summary: get dashboards
      operationId: dashboards#get
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Dashboard'
            required:
              - id
              - name
              - widgets
              - created_at
              - updated_at
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
    put:
      tags:
        - dashboards
      summary: update dashboards
      operationId: dashboards#update
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
        - name: UpdateRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/DashboardsUpdateRequestBody'
            required:
              - name
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Dashboard'
            required:
              - id
              - name
              - widgets
              - created_at
              - updated_at
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
    delete:
      tags:
        - dashboards
      summary: delete dashboards
      operationId: dashboards#delete
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "204":
          description: No Content response.
      schemes:
        - http
  /api/v1/dashboards/{id}/resolve:
    get:
      tags:
        - dashboards
      summary: resolve dashboards
      operationId: dashboards#resolve
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/DashboardResolved'
            required:
              - id
              - name
              - widgets
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/demo/scenarios:
    get:
      tags:
        - workspace
      summary: demo_scenarios workspace
      description: Guided demo scenarios for Query Investigation
      operationId: workspace#demo_scenarios
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/DemoScenarioList'
            required:
              - items
      schemes:
        - http
  /api/v1/investigations:
    get:
      tags:
        - investigations
      summary: list investigations
      description: List query investigations for the current organization
      operationId: investigations#list
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/InvestigationList'
            required:
              - items
              - limit
              - offset
      schemes:
        - http
    post:
      tags:
        - investigations
      summary: create investigations
      description: Start a new query investigation from SQL or pg_stat_statements context
      operationId: investigations#create
      parameters:
        - name: CreateRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateInvestigationPayload'
            required:
              - title
              - sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}:
    get:
      tags:
        - investigations
      summary: get investigations
      description: Get a query investigation with evidence
      operationId: investigations#get
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}/candidate:
    post:
      tags:
        - investigations
      summary: add_candidate investigations
      description: Add a candidate rewrite and compare plans
      operationId: investigations#add_candidate
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
        - name: add_candidate_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AddCandidatePayload'
            required:
              - candidate_sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}/fix:
    post:
      tags:
        - investigations
      summary: update_fix investigations
      description: Advance the fix lifecycle (proposed -> verified -> applied) and record a PR/ticket link. Marking 'applied' snapshots the query's current latency so the poller can confirm the fix.
      operationId: investigations#update_fix
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
        - name: update_fix_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateFixPayload'
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}/rank-candidates:
    post:
      tags:
        - investigations
      summary: rank_candidates investigations
      description: Generate rewrite and index-DDL candidates, dry-EXPLAIN rewrites, project index cost (hypopg or honest heuristic), and rank by cost/partitions
      operationId: investigations#rank_candidates
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
        - name: rank_candidates_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InvestigationsRankCandidatesRequestBody'
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/RankedCandidateList'
            required:
              - candidates
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}/report:
    post:
      tags:
        - investigations
      summary: generate_report investigations
      description: Generate an engineering investigation report
      operationId: investigations#generate_report
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/{id}/suggest-rewrite:
    post:
      tags:
        - investigations
      summary: suggest_rewrite investigations
      description: Suggest candidate SQL rewrites from the investigation SQL and plan findings (AST-based; no demo scenarios required)
      operationId: investigations#suggest_rewrite
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/RewriteSuggestionList'
            required:
              - candidates
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/investigations/from-regression:
    post:
      tags:
        - investigations
      summary: create_from_regression investigations
      description: Open an investigation from a regression alert (EXPLAIN + link alert to investigation)
      operationId: investigations#create_from_regression
      parameters:
        - name: create_from_regression_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/InvestigationsCreateFromRegressionRequestBody'
            required:
              - regression_alert_id
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Investigation'
            required:
              - id
              - title
              - status
              - sql
              - connection_id
              - created_at
              - updated_at
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/queries/explain:
    post:
      tags:
        - queries
      summary: explain_plan queries
      description: Run EXPLAIN (FORMAT JSON) on a read-only query and return plan analysis
      operationId: queries#explain_plan
      parameters:
        - name: explain_plan_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ExplainQueryPayload'
            required:
              - sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ExplainQueryResult'
            required:
              - sql
              - total_cost
              - plan
              - findings
              - request_wall_time_ms
              - evidence_mode
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/queries/explain/compare:
    post:
      tags:
        - queries
      summary: compare_plans queries
      description: Compare before and after execution plans for a query rewrite or index change
      operationId: queries#compare_plans
      parameters:
        - name: compare_plans_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ComparePlansPayload'
            required:
              - before_sql
              - after_sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ComparePlansResult'
            required:
              - before
              - after
              - metrics
              - diff
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/queries/run:
    post:
      tags:
        - queries
      summary: run queries
      description: Execute a SQL query and return results
      operationId: queries#run
      parameters:
        - name: RunRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/RunQueryPayload'
            required:
              - sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/RunQueryResult'
            required:
              - columns
              - rows
              - row_count
              - execution_time_ms
              - limit
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/queries/saved:
    get:
      tags:
        - queries
      summary: list_saved queries
      description: List saved queries
      operationId: queries#list_saved
      parameters:
        - name: tags
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: connection_id
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          maximum: 100
          minimum: 1
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/SavedQueryList'
            required:
              - items
              - limit
              - offset
      schemes:
        - http
    post:
      tags:
        - queries
      summary: save queries
      description: Save a query
      operationId: queries#save
      parameters:
        - name: SaveRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/SaveQueryPayload'
            required:
              - name
              - sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/SavedQuery'
            required:
              - id
              - name
              - sql
              - connection_id
              - created_at
              - updated_at
      schemes:
        - http
  /api/v1/queries/saved/{id}:
    get:
      tags:
        - queries
      summary: get_saved queries
      description: Get saved query by ID
      operationId: queries#get_saved
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/SavedQuery'
            required:
              - id
              - name
              - sql
              - connection_id
              - created_at
              - updated_at
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
    delete:
      tags:
        - queries
      summary: delete_saved queries
      description: Delete a saved query
      operationId: queries#delete_saved
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "204":
          description: No Content response.
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/queries/stats:
    get:
      tags:
        - queries
      summary: stat_statements queries
      description: List top queries from pg_stat_statements (read-only observability)
      operationId: queries#stat_statements
      parameters:
        - name: order_by
          in: query
          description: 'Sort key: total_time, mean_time, or calls'
          required: false
          type: string
          default: total_time
          enum:
            - total_time
            - mean_time
            - calls
        - name: limit
          in: query
          required: false
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        - name: connection_id
          in: query
          description: Optional connection ID; defaults to server default connection
          required: false
          type: string
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/StatStatementsResult'
            required:
              - items
              - order_by
              - limit
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports:
    get:
      tags:
        - reports
      summary: list reports
      description: List generated reports
      operationId: reports#list
      parameters:
        - name: saved_query_id
          in: query
          required: false
          type: string
          format: uuid
        - name: connection_id
          in: query
          required: false
          type: string
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          maximum: 100
          minimum: 1
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ReportList'
            required:
              - items
              - limit
              - offset
      schemes:
        - http
  /api/v1/reports/{id}:
    get:
      tags:
        - reports
      summary: get reports
      description: Get a report by ID
      operationId: reports#get
      parameters:
        - name: id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Report'
            required:
              - id
              - sql
              - connection_id
              - narrative
              - metrics
              - created_at
              - llm_model
              - llm_provider
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/{report_id}/shares:
    get:
      tags:
        - reports
      summary: list_shares reports
      description: List active and revoked share links for a report. Never returns the raw token, only non-secret metadata.
      operationId: reports#list_shares
      parameters:
        - name: report_id
          in: path
          required: true
          type: string
          format: uuid
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ReportShareList'
            required:
              - items
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/generate:
    post:
      tags:
        - reports
      summary: generate reports
      description: Generate a narrative report from a SQL query
      operationId: reports#generate
      parameters:
        - name: GenerateRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/GenerateReportPayload'
            required:
              - sql
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Report'
            required:
              - id
              - sql
              - connection_id
              - narrative
              - metrics
              - created_at
              - llm_model
              - llm_provider
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "500":
          description: Internal Server Error response.
          schema:
            $ref: '#/definitions/LLMError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/rewrite:
    post:
      tags:
        - reports
      summary: rewrite reports
      description: Rewrite an existing report narrative using a user instruction.
      operationId: reports#rewrite
      parameters:
        - name: RewriteRequestBody
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReportsRewriteRequestBody'
            required:
              - report_id
              - instruction
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/NarrativeContent'
            required:
              - headline
              - takeaways
        "400":
          description: Bad Request response.
          schema:
            $ref: '#/definitions/ValidationError'
            required:
              - name
              - message
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
        "500":
          description: Internal Server Error response.
          schema:
            $ref: '#/definitions/LLMError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/share:
    post:
      tags:
        - reports
      summary: create_share reports
      description: Create or refresh a shareable read-only token link for a report.
      operationId: reports#create_share
      parameters:
        - name: create_share_request_body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ReportsCreateShareRequestBody'
            required:
              - report_id
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/ReportShareLink'
            required:
              - token
              - url
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/shared/{token}:
    get:
      tags:
        - reports
      summary: get_shared reports
      description: Fetch a report by valid share token.
      operationId: reports#get_shared
      parameters:
        - name: token
          in: path
          required: true
          type: string
          minLength: 12
      responses:
        "200":
          description: OK response.
          schema:
            $ref: '#/definitions/Report'
            required:
              - id
              - sql
              - connection_id
              - narrative
              - metrics
              - created_at
              - llm_model
              - llm_provider
        "404":
          description: Not Found response.
          schema:
            $ref: '#/definitions/NotFoundError'
            required:
              - name
              - message
      schemes:
        - http
  /api/v1/reports/shares/{id}/revoke:
    post:
      tags:
        - reports
      summary: revoke_share reports
      description: Revoke a share link so it can no longer be used to fetch its report.
      operationId: reports#revoke_share
      parameters:
        - name: id
          in: path
          description: Share link ID (not the token)
          required: true
          type: string
