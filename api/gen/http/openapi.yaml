definitions:
  AddCandidatePayload:
    title: AddCandidatePayload
    type: object
    properties:
      analyze:
        type: boolean
        default: false
      binds:
        type: array
        items:
          type: string
        description: Sample bind values for a parameterized candidate ($1, $2, ...); used only for the compare/equivalence run, not stored
      candidate_sql:
        type: string
        pattern: ^[^;]+$
        minLength: 1
        maxLength: 10000
      verify_results:
        type: boolean
        description: Execute the candidate and the original to check result equivalence. Requires the `query` permission on the connection.
        default: false
    required:
      - candidate_sql
  AggregateData:
    title: AggregateData
    type: object
    properties:
      avg:
        type: number
        format: double
      count:
        type: integer
        format: int32
      max:
        type: number
        format: double
      min:
        type: number
        format: double
      std_dev:
        type: number
        description: Standard deviation (stats)
        format: double
      sum:
        type: number
        format: double
  AnomalyPointData:
    title: AnomalyPointData
    type: object
    properties:
      explanation:
        type: string
        description: One-sentence explanation for why this period may be anomalous
      period_label:
        type: string
      reason:
        type: string
      value:
        type: number
        format: double
    required:
      - period_label
      - value
      - reason
  AskResult:
    title: AskResult
    type: object
    properties:
      question:
        type: string
        description: The original natural-language question
      report:
        $ref: '#/definitions/Report'
      sql:
        type: string
        description: The generated and executed SQL
    required:
      - question
      - sql
      - report
  ChartSuggestion:
    title: ChartSuggestion
    type: object
    properties:
      chart_type:
        type: string
        description: 'Chart type identifier: bar, line, pie, area, table'
      label:
        type: string
        description: Human-readable label
      reason:
        type: string
        description: Why this chart fits the data
    required:
      - chart_type
      - label
      - reason
  ChatResult:
    title: ChatResult
    type: object
    properties:
      follow_ups:
        type: array
        items:
          type: string
      history:
        type: array
        items:
          $ref: '#/definitions/ChatTurn'
      question:
        type: string
      report:
        $ref: '#/definitions/Report'
      session_id:
        type: string
      sql:
        type: string
    required:
      - session_id
      - question
      - sql
      - report
      - history
      - follow_ups
  ChatTurn:
    title: ChatTurn
    type: object
    properties:
      created_at:
        type: string
        format: date-time
      question:
        type: string
      sql:
        type: string
    required:
      - question
      - sql
      - created_at
  CohortMetricData:
    title: CohortMetricData
    type: object
    properties:
      cohort_label:
        type: string
      periods:
        type: array
        items:
          $ref: '#/definitions/CohortPeriodPointData'
      retention_pct:
        type: number
        format: double
    required:
      - cohort_label
  CohortPeriodPointData:
    title: CohortPeriodPointData
    type: object
    properties:
      period_label:
        type: string
      value:
        type: number
        format: double
    required:
      - period_label
      - value
  ColumnInfo:
    title: ColumnInfo
    type: object
    properties:
      name:
        type: string
      type:
        type: string
    required:
      - name
      - type
  ColumnQualityData:
    title: ColumnQualityData
    type: object
    properties:
      distinct_count:
        type: integer
        format: int32
      null_count:
        type: integer
        format: int32
      null_pct:
        type: number
        description: Null percentage 0–100
        format: double
      total_rows:
        type: integer
        format: int32
    required:
      - null_count
      - distinct_count
      - total_rows
      - null_pct
  ComparePlansPayload:
    title: ComparePlansPayload
    type: object
    properties:
      after_sql:
        type: string
        description: Candidate SQL to explain
        pattern: ^[^;]+$
        minLength: 1
        maxLength: 10000
      analyze:
        type: boolean
        description: Run EXPLAIN ANALYZE when enabled server-side
        default: false
      before_sql:
        type: string
        description: Original SQL to explain
        pattern: ^[^;]+$
        minLength: 1
        maxLength: 10000
      binds:
        type: array
        items:
          type: string
        description: Sample bind values for parameterized before/after SQL ($1, $2, ...); substituted for the compare/equivalence run
      connection_id:
        type: string
        description: Optional connection ID
      verify_results:
        type: boolean
        description: Execute both queries (COUNT(*) + bounded sample) to check result equivalence. Requires the `query` permission on the connection; off by default so a compare only plans.
        default: false
    required:
      - before_sql
      - after_sql
  ComparePlansResult:
    title: ComparePlansResult
    type: object
    properties:
      after:
        $ref: '#/definitions/ExplainQueryResult'
      before:
        $ref: '#/definitions/ExplainQueryResult'
      diff:
        $ref: '#/definitions/PlanComparisonDiff'
      metrics:
        type: array
        items:
          $ref: '#/definitions/PlanComparisonMetric'
      result_after_row_count:
        type: integer
        description: COUNT(*) of after SQL when computable
        format: int64
      result_before_row_count:
        type: integer
        description: COUNT(*) of before SQL when computable
        format: int64
      result_checksum_equal:
        type: boolean
        description: True when results match; false when they differ; omitted/null when unverified
      result_equivalence_notes:
        type: string
        description: Human-readable equivalence caveats (COUNT(*), sample size, failures)
      result_equivalence_status:
        type: string
        description: How far result equivalence was checked
        enum:
          - VerifiedEqual
          - SampleMatch
          - Different
          - Unverified
          - NotRequested
      result_sample_rows:
        type: integer
        description: Rows compared in the multiset sample
        format: int32
    required:
      - before
      - after
      - metrics
      - diff
  ConnectionInfo:
    title: ConnectionInfo
    type: object
    properties:
      id:
        type: string
      name:
        type: string
    required:
      - id
      - name
  ConnectionListResult:
    title: ConnectionListResult
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/ConnectionInfo'
    required:
      - items
  CorrelationPairData:
    title: CorrelationPairData
    type: object
    properties:
      column_a:
        type: string
      column_b:
        type: string
      pearson:
        type: number
        description: Pearson correlation -1 to 1
        format: double
      spearman:
        type: number
        description: Spearman rank correlation -1 to 1
        format: double
    required:
      - column_a
      - column_b
      - pearson
      - spearman
  CreateInvestigationPayload:
    title: CreateInvestigationPayload
    type: object
    properties:
      analyze:
        type: boolean
        description: Run EXPLAIN ANALYZE (executes the query) instead of an estimate-only plan
        default: false
      calls:
        type: integer
        format: int64
      connection_id:
        type: string
      mean_time_ms:
        type: number
        format: double
      queryid:
        type: string
        description: Optional pg_stat_statements queryid for context
      rows:
        type: integer
        format: int64
      sql:
        type: string
        pattern: ^[^;]+$
        minLength: 1
        maxLength: 10000
      title:
        type: string
        minLength: 1
        maxLength: 200
      total_time_ms:
        type: number
        format: double
    required:
      - title
      - sql
  Dashboard:
    title: Dashboard
    type: object
    properties:
      created_at:
        type: string
        format: date-time
      id:
        type: string
        format: uuid
      name:
        type: string
      updated_at:
        type: string
        format: date-time
      widgets:
        type: array
        items:
          $ref: '#/definitions/DashboardWidget'
    required:
      - id
      - name
      - widgets
      - created_at
      - updated_at
  DashboardListResult:
    title: DashboardListResult
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/Dashboard'
    required:
      - items
  DashboardResolved:
    title: DashboardResolved
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      widgets:
        type: array
        items:
          $ref: '#/definitions/DashboardResolvedWidget'
    required:
      - id
      - name
      - widgets
  DashboardResolvedWidget:
    title: DashboardResolvedWidget
    type: object
    properties:
      id:
        type: string
        format: uuid
      position:
        type: integer
        format: int32
      refresh_seconds:
        type: integer
        format: int32
      report:
        $ref: '#/definitions/Report'
      saved_query:
        $ref: '#/definitions/SavedQuery'
      title:
        type: string
      widget_type:
        type: string
    required:
      - id
      - widget_type
      - refresh_seconds
      - position
  DashboardWidget:
    title: DashboardWidget
    type: object
    properties:
      id:
        type: string
        format: uuid
      position:
        type: integer
        format: int32
      refresh_seconds:
        type: integer
        format: int32
      report_id:
        type: string
        format: uuid
      saved_query_id:
        type: string
        format: uuid
      title:
        type: string
      widget_type:
        type: string
    required:
      - id
      - widget_type
      - refresh_seconds
      - position
  DashboardWidgetInput:
    title: DashboardWidgetInput
    type: object
    properties:
      position:
        type: integer
        format: int32
      refresh_seconds:
        type: integer
        format: int32
      report_id:
        type: string
        format: uuid
      saved_query_id:
        type: string
        format: uuid
      title:
        type: string
      widget_type:
        type: string
    required:
      - widget_type
  DashboardsCreateRequestBody:
    title: DashboardsCreateRequestBody
    type: object
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
    required:
      - name
  DashboardsUpdateRequestBody:
    title: DashboardsUpdateRequestBody
    type: object
    properties:
      name:
        type: string
        minLength: 1
