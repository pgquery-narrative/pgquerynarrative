    title: ExplainQueryPayload
    type: object
    properties:
      analyze:
        type: boolean
        description: When true, run EXPLAIN (ANALYZE, FORMAT JSON) instead of estimate-only
        default: false
      connection_id:
        type: string
        description: Optional connection ID; defaults to server default connection
      sql:
        type: string
        description: Read-only SQL to explain (SELECT or WITH)
        pattern: ^[^;]+$
        minLength: 1
        maxLength: 10000
    required:
      - sql
  ExplainQueryResult:
    title: ExplainQueryResult
    type: object
    properties:
      diagnosis:
        $ref: '#/definitions/PlanDiagnosis'
      evidence_mode:
        type: string
        description: estimated (plan only) or observed (ANALYZE timings)
        enum:
          - estimated
          - observed
      findings:
        type: array
        items:
          $ref: '#/definitions/PlanFinding'
        description: Notable plan nodes (seq scans, high-cost operators)
      generic_plan:
        type: boolean
        description: True when the plan came from EXPLAIN (GENERIC_PLAN) because the query is parameterized ($1, $2, ...)
      plan:
        description: Raw EXPLAIN (FORMAT JSON) output
      planning_time_ms:
        type: number
        description: PostgreSQL's own Planning Time for the statement
        format: double
      request_wall_time_ms:
        type: integer
        description: Wall-clock time this server spent issuing the EXPLAIN and parsing the plan — network + planning + (for ANALYZE) execution. NOT the query's execution time.
        format: int64
      server_execution_time_ms:
        type: number
        description: PostgreSQL's own Execution Time — non-zero only when ANALYZE actually ran the query
        format: double
      sql:
        type: string
        description: The inner read-only SQL that was explained
      total_cost:
        type: number
        description: Estimated total cost from the root plan node
        format: double
    required:
      - sql
      - total_cost
      - plan
      - findings
      - request_wall_time_ms
      - evidence_mode
