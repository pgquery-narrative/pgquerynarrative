groups:
  - name: pgquerynarrative
    rules:
      - alert: PgqnHighHTTPErrorRate
        expr: rate(pgqn_http_errors_total[5m]) / clamp_min(rate(pgqn_http_requests_total[5m]), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx rate on PgQueryNarrative
          runbook: docs/reference/operations.md#http-5xx-spike

      - alert: PgqnAuthFailureSpike
        expr: rate(pgqn_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated authentication failures
          runbook: docs/reference/operations.md#auth-failure-spike

      - alert: PgqnQueryTimeoutSpike
        expr: rate(pgqn_query_timeouts_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query timeouts elevated
          runbook: docs/reference/operations.md#query-timeouts

      - alert: PgqnLLMBudgetDenials
        expr: increase(pgqn_llm_budget_denials_total[15m]) > 5
        for: 5m
        labels:
          severity: info
        annotations:
          summary: LLM budget denials increasing
          runbook: docs/reference/operations.md#llm-budget-exhausted

      - alert: PgqnPoolSaturation
        expr: pgqn_pool_acquired_conns / clamp_min(pgqn_pool_max_conns, 1) > 0.85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: App DB pool near capacity
          runbook: docs/reference/operations.md#db-pool-saturation

      - alert: PgqnSchedulerFailures
        expr: increase(pgqn_scheduler_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Scheduled report runs are failing
          runbook: docs/reference/operations.md#scheduler-stuck--duplicate-runs

      - alert: PgqnScheduleDeadLetters
        expr: increase(pgqn_schedule_dead_letters_total[30m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Scheduled report runs reached dead-letter state
          runbook: docs/reference/operations.md#scheduler-stuck--duplicate-runs

      - alert: PgqnWebhookFailures
        expr: increase(pgqn_webhook_failures_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries are failing
          runbook: docs/reference/operations.md#webhook-delivery-failures--dead-letter

      - alert: PgqnWebhookDeadLetters
        expr: increase(pgqn_webhook_dead_letters_total[30m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Webhook deliveries reached dead-letter state
          runbook: docs/reference/operations.md#webhook-delivery-failures--dead-letter
