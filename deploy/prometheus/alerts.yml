groups:
  - name: pgquerynarrative
    rules:
      - alert: PgqnHighHTTPErrorRate
        expr: rate(pgqn_http_errors_total[5m]) / clamp_min(rate(pgqn_http_requests_total[5m]), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 5xx rate on PgQueryNarrative
          runbook: docs/ops/INCIDENT_RUNBOOKS.md#http-5xx-spike

      - alert: PgqnAuthFailureSpike
        expr: rate(pgqn_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated authentication failures
          runbook: docs/ops/INCIDENT_RUNBOOKS.md#auth-failure-spike

      - alert: PgqnQueryTimeoutSpike
        expr: rate(pgqn_query_timeouts_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Query timeouts elevated
          runbook: docs/ops/INCIDENT_RUNBOOKS.md#query-timeouts

      - alert: PgqnLLMBudgetDenials
        expr: increase(pgqn_llm_budget_denials_total[15m]) > 5
        for: 5m
        labels:
          severity: info
        annotations:
          summary: LLM budget denials increasing
          runbook: docs/ops/INCIDENT_RUNBOOKS.md#llm-budget-exhausted

      - alert: PgqnPoolSaturation
        expr: pgqn_pool_acquired_conns / clamp_min(pgqn_pool_max_conns, 1) > 0.85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: App DB pool near capacity
          runbook: docs/ops/INCIDENT_RUNBOOKS.md#db-pool-saturation
