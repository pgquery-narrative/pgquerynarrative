# Create this secret with your actual credentials. Do not commit real values.
# Plaintext SECURITY_API_KEY is rejected when APP_ENV=production — use SECURITY_API_KEY_HASH.
#   printf '%s' "$API_KEY" | shasum -a 256 | awk '{print $1}'
#
# Example:
#   kubectl create secret generic pgquerynarrative-secret -n pgquerynarrative \
#     --from-literal=DATABASE_PASSWORD=xxx \
#     --from-literal=DATABASE_READONLY_PASSWORD=xxx \
#     --from-literal=SECURITY_API_KEY_HASH=xxx \
#     --from-literal=SECURITY_SESSION_SECRET=xxx \
#     --from-literal=SECURITY_DATA_ENCRYPTION_KEY=xxx
apiVersion: v1
kind: Secret
metadata:
  name: pgquerynarrative-secret
  namespace: pgquerynarrative
  labels:
    app.kubernetes.io/name: pgquerynarrative
type: Opaque
stringData:
  DATABASE_PASSWORD: ""           # REQUIRED: >=16 chars, not a placeholder
  DATABASE_READONLY_PASSWORD: ""  # REQUIRED: >=16 chars, not a placeholder
  SECURITY_API_KEY_HASH: ""       # REQUIRED: SHA-256 hex of API key
  SECURITY_SESSION_SECRET: ""     # REQUIRED: >=32 chars
  SECURITY_DATA_ENCRYPTION_KEY: "" # REQUIRED: >=32 chars (or rely on session secret)
  SECURITY_OIDC_CLIENT_SECRET: ""
  SECURITY_WEBHOOK_SIGNING_SECRET: ""  # required when SCHEDULE_RUNNER_ENABLED=true
