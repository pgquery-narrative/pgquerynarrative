apiVersion: v1
kind: ConfigMap
metadata:
  name: pgquerynarrative-config
  namespace: pgquerynarrative
  labels:
    app.kubernetes.io/name: pgquerynarrative
data:
  PGQUERYNARRATIVE_HOST: "0.0.0.0"
  PGQUERYNARRATIVE_PORT: "8080"
  APP_ENV: "production"
  DATABASE_HOST: "postgres"          # override if using external DB
  DATABASE_PORT: "5432"
  DATABASE_NAME: "pgquerynarrative"
  DATABASE_USER: "pgquerynarrative_app"
  DATABASE_SSL_MODE: "require"
  DATABASE_ALLOWED_SCHEMAS: "demo"
  DATABASE_MAX_CONNECTIONS: "5"
  DATABASE_READONLY_USER: "pgquerynarrative_readonly"
  SECURITY_AUTH_ENABLED: "true"
  SECURITY_RATE_LIMIT_RPM: "120"
  SECURITY_RATE_LIMIT_DISTRIBUTED: "true"
  SECURITY_SHARE_LINK_DEFAULT_HOURS: "168"
  SECURITY_EXPLAIN_ANALYZE_ENABLED: "false"
  SECURITY_STAT_STATEMENTS_ENABLED: "true"
  LLM_REDACT_PII: "true"
  SCHEDULE_RUNNER_ENABLED: "true"
  SCHEDULE_RUNNER_INTERVAL: "1m"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.2"
  LLM_BASE_URL: "http://host.docker.internal:11434"  # or your LLM endpoint
