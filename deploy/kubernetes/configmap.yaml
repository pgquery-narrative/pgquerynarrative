apiVersion: v1
kind: ConfigMap
metadata:
  name: pgquerynarrative-config
  namespace: pgquerynarrative
  labels:
    app.kubernetes.io/name: pgquerynarrative
data:
  PGQUERYNARRATIVE_HOST: "0.0.0.0"
  PGQUERYNARRATIVE_PORT: "8080"
  APP_ENV: "production"
  DATABASE_HOST: "postgres"          # override if using external DB
  DATABASE_PORT: "5432"
  DATABASE_NAME: "pgquerynarrative"
  DATABASE_USER: "pgquerynarrative_app"
  DATABASE_SSL_MODE: "require"
  DATABASE_ALLOWED_SCHEMAS: "analytics"
  DATABASE_MAX_CONNECTIONS: "5"
  DATABASE_MIN_CONNECTIONS: "0"
  DATABASE_GLOBAL_MAX_CONNECTIONS: "40"
  DATABASE_READONLY_USER: "pgquerynarrative_readonly"
  QUERY_TIMEOUT: "30s"
  QUERY_LOCK_TIMEOUT: "2s"
  QUERY_IDLE_IN_TX_TIMEOUT: "10s"
  QUERY_MAX_RESULT_BYTES: "10485760"
  QUERY_MAX_CELL_BYTES: "1048576"
  QUERY_MAX_COLUMNS: "100"
  SECURITY_AUTH_ENABLED: "true"
  SECURITY_ALLOW_INSECURE_NO_AUTH: "false"
  SECURITY_RATE_LIMIT_RPM: "120"
  SECURITY_RATE_LIMIT_DISTRIBUTED: "true"
  SECURITY_RATE_LIMIT_FAILURE_MODE: "closed"
  SECURITY_AUDIT_MODE: "required"
  SECURITY_SHARE_LINKS_ENABLED: "false"
  SECURITY_SHARE_LINK_DEFAULT_HOURS: "168"
  SECURITY_EXPLAIN_ANALYZE_ENABLED: "false"
  SECURITY_STAT_STATEMENTS_ENABLED: "true"
  SECURITY_OIDC_ISSUER: ""          # e.g. https://your-idp.example.com
  SECURITY_OIDC_AUDIENCE: "pgquerynarrative"
  SECURITY_OIDC_CLIENT_ID: ""
  SECURITY_OIDC_REDIRECT_URL: ""    # e.g. https://pgquerynarrative.example.com/auth/callback
  SECURITY_SESSION_TTL: "8h"
  SECURITY_OIDC_AUTO_JOIN_DEFAULT_ORG: "false"
  SECURITY_WEBHOOK_ALLOWED_HOSTS: ""  # required when SCHEDULE_RUNNER_ENABLED=true
  LLM_REDACT_PII: "true"
  LLM_SEND_ROW_DATA: "false"
  LLM_ALLOW_EXTERNAL_DATA: "false"
  LLM_BUDGET_FAIL_CLOSED: "true"
  SCHEDULE_RUNNER_ENABLED: "false"
  SCHEDULE_RUNNER_INTERVAL: "1m"
  SCHEDULE_DURABLE_LEASES: "true"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.2"
  LLM_BASE_URL: "http://ollama.example.internal:11434"
