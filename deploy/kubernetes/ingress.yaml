# Optional: expose the app via Ingress with TLS.
# HSTS is emitted by the app when X-Forwarded-Proto=https.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgquerynarrative
  namespace: pgquerynarrative
  labels:
    app.kubernetes.io/name: pgquerynarrative
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pgquerynarrative.example.com
      secretName: pgquerynarrative-tls
  rules:
    - host: pgquerynarrative.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgquerynarrative
                port:
                  number: 8080
