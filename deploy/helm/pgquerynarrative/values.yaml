# Default values for pgquerynarrative.
# Override when installing: helm install pgqn ./deploy/helm/pgquerynarrative -f my-values.yaml

replicaCount: 1

image:
  repository: pgquerynarrative
  tag: latest
  pullPolicy: IfNotPresent

appEnv: production

# Database: point to your Postgres (in-cluster or external)
database:
  host: postgres
  port: "5432"
  name: pgquerynarrative
  user: pgquerynarrative_app
  sslMode: require
  maxConnections: 5
  readonlyUser: pgquerynarrative_readonly
  allowedSchemas: demo

# Secrets: set via --set or a values file; do not commit real passwords
secret:
  databasePassword: changeme
  databaseReadonlyPassword: changeme
  apiKey: changeme-replace-with-long-random-api-key-at-least-32-chars
  sessionSecret: changeme-replace-with-long-random-session-secret
  oidcClientSecret: ""
  webhookSigningSecret: ""

oidc:
  issuer: ""
  audience: pgquerynarrative
  clientID: ""
  redirectURL: ""
  sessionTTL: 8h
  autoJoinDefaultOrg: true

webhook:
  allowedHosts: ""

security:
  authEnabled: true
  rateLimitRPM: 120
  rateLimitDistributed: true
  explainAnalyzeEnabled: false
  statStatementsEnabled: true
  shareLinkDefaultHours: 168
  scheduleRunnerEnabled: true
  scheduleRunnerInterval: 1m

llm:
  provider: ollama
  model: llama3.2
  baseURL: http://host.docker.internal:11434
  redactPII: true
  # apiKey: ""  # for OpenAI, Groq, etc.

server:
  host: "0.0.0.0"
  port: "8080"

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m

# Optional: seed demo data on first run
seed: false

# Ingress: set enabled true and set host to expose via Ingress
ingress:
  enabled: false
  className: nginx
  host: pgquerynarrative.local
  # tls:
  #   enabled: false
  #   secretName: pgquerynarrative-tls

service:
  type: ClusterIP
  port: 8080
