# Default values for pgquerynarrative.
# Chart defaults are StrictMode-aligned (APP_ENV=production). Install fails until
# required secrets are overridden — do not ship placeholder passwords/keys.
#
#   helm install pgqn ./deploy/helm/pgquerynarrative -f my-values.yaml
#
# See values-production.example.yaml for a complete override checklist.

replicaCount: 1

image:
  repository: pgquerynarrative
  tag: latest
  pullPolicy: IfNotPresent

# Forces config.Validate() StrictMode checks at process start.
appEnv: production

# Database: point to your Postgres (in-cluster or external)
database:
  host: postgres
  port: "5432"
  name: pgquerynarrative
  user: pgquerynarrative_app
  sslMode: require
  maxConnections: 5
  minConnections: "0"
  globalMaxConnections: "40"
  readonlyUser: pgquerynarrative_readonly
  # Curate reporting schemas only; never point at raw OLTP schemas in production.
  allowedSchemas: analytics
  queryTimeout: 30s
  lockTimeout: 2s
  idleInTxTimeout: 10s
  maxResultBytes: "10485760"
  maxCellBytes: "1048576"
  maxColumns: "100"

# Secrets: REQUIRED overrides. Empty values fail helm template/install.
# Generate API key hash:  printf '%s' "$API_KEY" | shasum -a 256 | awk '{print $1}'
secret:
  databasePassword: ""
  databaseReadonlyPassword: ""
  # Preferred in production (plaintext SECURITY_API_KEY is rejected by StrictMode).
  apiKeyHash: ""
  sessionSecret: ""
  dataEncryptionKey: ""
  oidcClientSecret: ""
  webhookSigningSecret: ""

oidc:
  issuer: ""
  audience: pgquerynarrative
  clientID: ""
  redirectURL: ""
  sessionTTL: 8h
  autoJoinDefaultOrg: false

webhook:
  # Required for any webhook destination (empty allowlist fails closed).
  allowedHosts: ""

security:
  authEnabled: true
  allowInsecureNoAuth: false
  rateLimitRPM: 120
  rateLimitDistributed: true
  # Fail closed when the distributed limiter backend is unavailable.
  rateLimitFailureMode: closed
  auditMode: required
  explainAnalyzeEnabled: false
  shareLinksEnabled: false
  statStatementsEnabled: true
  shareLinkDefaultHours: 168
  # Keep off until webhook allowlist + signing secret are configured.
  scheduleRunnerEnabled: false
  scheduleRunnerInterval: 1m
  scheduleDurableLeases: true

llm:
  provider: ollama
  model: llama3.2
  baseURL: http://ollama.example.internal:11434
  redactPII: true
  sendRowData: false
  allowExternalData: false
  budgetFailClosed: true
  # apiKey: ""  # for OpenAI, Groq, etc.

server:
  host: "0.0.0.0"
  port: "8080"

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 500m

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Optional: seed demo data on first run (disable for company data).
seed: false

# NetworkPolicy: restrict ingress to ingress-controller + same-namespace; egress DNS/Postgres/HTTPS.
networkPolicy:
  enabled: true
  ingressFrom: []

# Ingress: enable TLS for production (HSTS is set by the app when X-Forwarded-Proto=https).
ingress:
  enabled: false
  className: nginx
  host: pgquerynarrative.local
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls: []
  # Example:
  # tls:
  #   - hosts:
  #       - pgquerynarrative.example.com
  #     secretName: pgquerynarrative-tls

service:
  type: ClusterIP
  port: 8080
