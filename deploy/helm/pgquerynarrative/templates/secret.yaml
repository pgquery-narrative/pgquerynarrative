{{- include "pgquerynarrative.validateSecrets" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgquerynarrative.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.secret.databasePassword | quote }}
  DATABASE_READONLY_PASSWORD: {{ .Values.secret.databaseReadonlyPassword | quote }}
  SECURITY_API_KEY_HASH: {{ .Values.secret.apiKeyHash | quote }}
  SECURITY_SESSION_SECRET: {{ .Values.secret.sessionSecret | quote }}
  SECURITY_DATA_ENCRYPTION_KEY: {{ .Values.secret.dataEncryptionKey | quote }}
  SECURITY_OIDC_CLIENT_SECRET: {{ .Values.secret.oidcClientSecret | quote }}
  SECURITY_WEBHOOK_SIGNING_SECRET: {{ .Values.secret.webhookSigningSecret | quote }}
  {{- if .Values.llm.apiKey }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
